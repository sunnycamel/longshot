[package]
name = "longshot"
version = "0.1.0"
edition = "2021"
description = "A Rust macOS scrolling screenshot menu-bar app"
license = "MIT"

[dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
core-graphics = "0.25"
core-foundation = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }
arboard = "3"
chrono = "0.4"

[[bin]]
name = "longshot"
path = "src/main.rs"

# 图标生成工具（设计迭代用），不参与常规构建，需显式启用 feature：
#   cargo run --release --features icon-tool --bin make-icon
[[bin]]
name = "make-icon"
path = "tools/make_icon.rs"
required-features = ["icon-tool"]

[features]
icon-tool = []

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
